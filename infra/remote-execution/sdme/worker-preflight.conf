[Service]
# The common unit uses PrivateTmp for the control plane. Workers need the
# dedicated /var/tmp bind because BuckOS action scratch defaults there.
PrivateTmp=no
ReadWritePaths=/var/tmp
Environment=PYTHONDONTWRITEBYTECODE=1
ExecStartPre=/usr/local/libexec/buckos-re/preflight-worker.sh --worker-user nativelink --arch ${BUCKOS_RE_WORKER_ARCH} --scratch-root /var/tmp --probe-sysroot /opt/buckos-re/probe-sysroot --min-scratch-bytes ${BUCKOS_RE_MIN_SCRATCH_BYTES} --min-scratch-inodes ${BUCKOS_RE_MIN_SCRATCH_INODES} --tools-dir /usr/local/libexec/buckos-re/tools
